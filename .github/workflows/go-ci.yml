# ============ Workflow 元信息 ============

# 为什么叫 "Go CI" 而不是 "Go Lint and Test"？
# → CI 是业界通用术语，团队成员一看就知道这是检查代码质量的流水线
# 作用：给 Workflow 一个人类可读的名字，显示在 GitHub Actions 页面上
name: Go CI

# ============ 触发器 ============

# 为什么 push + pull_request 都触发？
# → push 保护当前分支质量（每次提交都检查），pull_request 保护 main 分支（合并前再检查一次）
#    双重保险确保坏代码进不了 main。如果只配 PR，开发分支上的提交不会自动检查
# 作用：定义什么事件自动触发这个 Workflow
on:
    push:
        branches: [main]
        paths:
            - "goLearning/go-project-learning/**"
            - ".github/workflows/go-ci.yml"
    pull_request:
        branches: [main]
        paths:
            - "goLearning/go-project-learning/**"
            - ".github/workflows/go-ci.yml"

# ============ 环境变量 ============

env:
    # 为什么用 working-directory 而不是每个 Step 写 cd？
    # → monorepo 根目录是 web3-learning，Go 项目在 goLearning/go-project-learning/
    #    working-directory 让所有 run 命令自动在此目录下执行
    WORK_DIR: goLearning/go-project-learning

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        # 所有 run 命令默认在此目录下执行
        defaults:
            run:
                working-directory: ${{ env.WORK_DIR }}

        # ============ 依赖服务（集成测试需要真实 MySQL + Redis） ============
        # 为什么 CI 里也要起 MySQL/Redis？
        # → user-srv 的仓库层/gRPC 集成测试会 InitDB(MySQL) + InitRedis(Redis)，
        #    连不上会 log.Fatal 直接退出。service container 提供真实依赖
        # 为什么端口是 3307/6380 而不是默认 3306/6379？
        # → 对齐 config.dev.yaml（本地 docker-compose 也是 3307/6380），
        #    测试代码不用改，本地和 CI 行为完全一致
        services:
            mysql:
                image: mysql:8.0
                env:
                    # 必须和 config.dev.yaml 的 mysql.password / dbname 一致
                    MYSQL_ROOT_PASSWORD: "123456"
                    MYSQL_DATABASE: userdb
                ports:
                    # 宿主机 3307 -> 容器 3306
                    - 3307:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10
                    --health-start-period=30s

            redis:
                image: redis:7-alpine
                ports:
                    # 宿主机 6380 -> 容器 6379
                    - 6380:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=5s
                    --health-timeout=3s
                    --health-retries=10

        steps:
            # ============ Step 1: 拉代码 ============
            - uses: actions/checkout@v4

            # ============ Step 2: 安装 Go ============

            # 为什么用 go-version-file 而不是写死版本号？
            # → go-version-file 读取 go.work 中的 go 版本声明，自动匹配本地开发环境
            #    本地升级 Go 版本后 CI 自动跟进，不用手动改 YAML
            - uses: actions/setup-go@v5
              with:
                go-version-file: goLearning/go-project-learning/go.work

            # ============ Step 3: Lint ============

            # 为什么用 go install 手动装 golangci-lint 而不是官方 golangci-lint-action？
            # → 官方 Action 的 working-directory 期望单模块目录（要有 go.sum 用于缓存）
            #    本项目是 Go workspace（go.work + 多模块），根目录没有 go.sum，
            #    Action 会报 "file is not found ... Supported file pattern: go.sum"
            #    go install + run 与本地 `golangci-lint run` 行为完全一致，绕过该限制
            - name: Install golangci-lint
              run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

            # 为什么显式指定模块目录而不是用 ./...？
            # → Go workspace 模式下 ./... 只匹配包含模块的目录
            #    go.work 里的模块都是子目录，./... 会报 "does not contain modules"
            #    必须逐个列出模块路径
            # 注意：order-srv/pay-srv/product-srv/promotion-srv 尚未实现（空骨架 main.go），暂不纳入 lint
            - name: Run golangci-lint
              run: golangci-lint run ./common/... ./gateway-api/... ./user-srv/...

            # ============ Step 4: 运行测试 ============

            # 为什么显式列出模块路径而不是用 ./...？
            # → Go workspace 模式下 ./... 不匹配子目录中的模块
            #    必须逐个列出 go.work 中声明的模块路径
            # 为什么 -count=1 禁用测试缓存？
            # → CI 的职责是"每次从头验证"
            - name: Run tests
              # order/pay/product/promotion 未实现（空骨架 main.go），暂不纳入测试
              run: go test ./common/... ./gateway-api/... ./user-srv/... -v -count=1 -coverprofile=coverage.out

            # ============ Step 5: 上传覆盖率文件 ============

            - name: Upload coverage
              uses: actions/upload-artifact@v4
              with:
                name: go-coverage
                path: ${{ env.WORK_DIR }}/coverage.out
    # ============ E2E 测试（testcontainers 启动真实依赖） ============
    # 为什么单独一个 job 而不是塞进 lint-and-test？
    # → E2E 最慢最贵（拉 MySQL/Redis 镜像、起容器），单独成 job 可以：
    #    1) 并行跑（不拖慢单元测试）  2) 单独重试（flaky 时只重跑 E2E）
    #    3) needs 依赖（单元测试失败就跳过，不浪费 CI 时间跑贵的测试）
    e2e-test:
        runs-on: ubuntu-latest
        # 为什么 needs: lint-and-test？
        # → 测试金字塔原则：便宜的单元测试先跑，通过了才跑贵的 E2E
        #    单元测试都挂了，E2E 大概率也挂，先省下这笔 CI 开销
        needs: lint-and-test
        defaults:
            run:
                working-directory: ${{ env.WORK_DIR }}/user-srv

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                go-version-file: goLearning/go-project-learning/go.work

            # ============ 运行 E2E 测试 ============
            # 为什么这里不需要 service container？
            # → testcontainers 会在测试代码里自己 docker run MySQL/Redis（随机端口），
            #   不需要 GitHub Actions 的 service container。
            #   这带来"环境无关"：本地和 CI 跑的是同一份代码，零改动
            # 为什么 ubuntu-latest 能跑 testcontainers？
            # → ubuntu-latest 镜像预装 Docker daemon，testcontainers 直接调用 Docker API
            # 为什么加 -tags=e2e？
            # → 只跑带 e2e build tag 的测试，配合改动 1 的 build tag 一起生效
            - name: Run E2E tests
              run: go test -tags=e2e ./e2e/ -v -count=1