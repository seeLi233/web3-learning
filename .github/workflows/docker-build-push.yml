# ============ Workflow 元信息 ============

# 为什么叫 "Docker Build & Push"？
# → 名字描述了这个 Workflow 做的事：构建 Docker 镜像 + 推送到 Registry
name: Docker Build & Push (Go)

# ============ 触发器 ============

# 为什么只在打 tag 时触发？
# → 每次 push 都构建镜像太浪费（GitHub Actions 免费额度 2000 分钟/月）
#    镜像构建只在"要发布一个版本"时做。Git Tag 就是版本发布的信号
on:
    push:
        tags:
            - "v*"
        # 注意：不能在这里加 paths 过滤器！
        # → GitHub Actions 不评估 tag push 的 paths（paths 对 tag 无效），
        #    但 paths 会让 main 分支的 push 也误触发（tags + paths 且无 branches 的已知坑）
        #    tag 本身就代表"要发布版本"，无需再按路径过滤

env:
    REGISTRY: docker.io
    # Go 项目子目录（monorepo 根目录是 web3-learning）
    WORK_DIR: goLearning/go-project-learning

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        # ============ Matrix 构建多个服务 ============
        strategy:
            matrix:
                service:
                    - name: gateway-api
                      # matrix 里不能用 ${{ env.WORK_DIR }}（matrix 在 env 解析前求值），硬编码路径
                      dockerfile: goLearning/go-project-learning/deploy/Dockerfile.gateway-api
                    - name: user-srv
                      dockerfile: goLearning/go-project-learning/deploy/Dockerfile.user-srv

        # 为什么需要这些权限？
        # → GHCR 推送需要 packages:write，GHA 缓存读写需要 actions:write
        permissions:
            contents: read
            packages: write
            actions: write

        steps:
            - uses: actions/checkout@v4

            # ============ 登录 Docker Hub ============
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            # ============ 设置 Buildx ============
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # ============ 提取元数据 ============
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}
                tags: |
                    type=semver,pattern={{version}}
                    type=semver,pattern={{major}}
                    type=semver,pattern={{major}}.{{minor}}
                    type=raw,value=latest

            # ============ 构建并推送镜像 ============
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                # 构建上下文是 Go 项目根目录（不是 monorepo 根！）
                context: ${{ env.WORK_DIR }}
                file: ${{ matrix.service.dockerfile }}
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
