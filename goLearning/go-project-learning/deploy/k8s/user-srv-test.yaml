apiVersion: v1
kind: ConfigMap
metadata:
  name: user-srv-config
  namespace: go-project-test
data:
  config.test.yaml: |
    mysql:
      host: mysql-svc
      port: 3306
      username: root
      password: ""
      dbname: userdb_test
      charset: utf8mb4
    redis:
      host: redis-svc
      port: 6379
      db: 0
      password: ""
      pool_size: 10
    consul:
      host: consul-svc
      port: 8500
    jwt:
      secret: ""
      access_expire: 7200
      refresh_expire: 604800
      issuer: "go-project-test"
    sms:
      provider: "dev"
      access_key: ""
      secret_key: ""
      sign_name: ""
      template: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-srv
  namespace: go-project-test
  labels:
    app: user-srv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-srv
  template:
    metadata:
      labels:
        app: user-srv
    spec:
      containers:
        - name: user-srv
          # 镜像说明：本地开发用 user-srv:latest + imagePullPolicy: IfNotPresent
          # CI/CD 部署时 kubectl set image 会覆盖为 docker.io/username/user-srv:vX.Y.Z
          image: user-srv:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 8082
              name: metrics
          # ============ 健康检查 ============
          # 为什么 user-srv 用 tcpSocket 而不是 httpGet？
          # → user-srv 是 gRPC 服务（50051），没有 HTTP 接口可供 httpGet 探测
          #    最标准的做法是实现 gRPC Health Protocol (grpc_health_v1)，
          #    但项目里没集成，所以用 tcpSocket 探测"端口是否可连接"作为简化方案
          # 作用：K8s 定期尝试连 50051 端口，连不上就判定服务异常
          livenessProbe:
            tcpSocket:
              port: 50051     # 探测 gRPC 端口
            # 为什么 initialDelaySeconds 要 30 秒而不是 5 秒？
            # → user-srv 启动时要连 Consul + MySQL + Redis + 加载风控配置，链路长
            #    如果 5 秒就开始探测，服务还没起来就被误判为"死"→ 疯狂重启 CrashLoopBackOff
            initialDelaySeconds: 30 # 启动后等 30 秒再开始探测
            periodSeconds: 10       # 之后每 10 秒探测一次
            timeoutSeconds: 3       # 单次 3 秒连不上算失败
            failureThreshold: 3     # 连续失败 3 次才判定"死"，触发重启（避免网络抖动误杀）
          readinessProbe:
            tcpSocket:
              port: 50051
            # 为什么 readiness 的 initialDelay 比 liveness 短（20 vs 30）？
            # → readiness 只是"摘除流量"，失败后果轻，可以更早开始探测
            #    而 liveness 失败会"重启容器"，后果重，要更保守（更长的延迟）
            initialDelaySeconds: 20 # 启动后等 20 秒开始探测就绪
            periodSeconds: 5       # 就绪探测更频繁（5 秒），因为要尽快恢复接流量
            timeoutSeconds: 3
            failureThreshold: 3    # 连续 3 次失败 → 从 Service 摘除，不转发流量
            successThreshold: 1    # 成功 1 次就恢复接流量（readiness 专属字段）
          env:
            - name: ENV
              value: "test"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # 从 Secret 注入敏感信息（覆盖 ConfigMap 中的空值）
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-srv-secret
                  key: mysql-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-srv-secret
                  key: jwt-secret
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs/config.test.yaml
              subPath: config.test.yaml
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config-volume
          configMap:
            name: user-srv-config
---
apiVersion: v1
kind: Service
metadata:
  name: user-srv
  namespace: go-project-test
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: user-srv
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
    - port: 8082
      targetPort: 8082
      name: metrics
  type: ClusterIP
