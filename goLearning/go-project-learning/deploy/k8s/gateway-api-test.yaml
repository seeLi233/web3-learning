apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-api-config
  namespace: go-project-test
data:
  config.test.yaml: |
    server:
      port: 8080
    user_srv:
      host: user-srv
      port: 50051
    redis:
      host: redis-svc
      port: 6379
      db: 0
      password: ""
      pool_size: 10
    jwt:
      secret: ""
      cookie_domain: ".test-domain.com"
      cookie_path: "/"
      cookie_secure: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: go-project-test
  labels:
    app: gateway-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      containers:
        - name: gateway-api
          # 镜像说明：本地开发用 gateway-api:latest + imagePullPolicy: IfNotPresent
          # CI/CD 部署时 kubectl set image 会覆盖为 docker.io/username/gateway-api:vX.Y.Z
          image: gateway-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # ============ 健康检查 ============
          # 为什么 gateway 用 httpGet 而 user-srv 用 tcpSocket？
          # → gateway 是 HTTP 服务（Gin 8080），有 /metrics 端点能返回 200 状态码
          #    httpGet 比 tcpSocket 强一档：不仅检查端口能连，还检查"应用层能正确响应 HTTP"
          #    tcpSocket 只能证明"端口开着"，httpGet 能证明"Web 框架真的在正常处理请求"
          livenessProbe:
            httpGet:
              path: /metrics    # 探测路径：Gin 活着就会返回 200
              port: 8080        # 探测端口（和 containerPort 一致）
            # 为什么 gateway 的 initialDelaySeconds 只有 15 秒，而 user-srv 是 30 秒？
            # → gateway 启动快：只是连 Redis + 初始化几个 gRPC 客户端，15 秒足够
            #    user-srv 要连 Consul+MySQL+Redis+加载风控配置，启动链路更长，所以要 30 秒
            initialDelaySeconds: 15 # 启动后等 15 秒开始探测
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3     # 连续 3 次失败才重启
          env:
            - name: ENV
              value: "test"
            # JWT Secret 从 Secret 注入（覆盖 ConfigMap 中的空值）
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-srv-secret
                  key: jwt-secret
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs/config.test.yaml
              subPath: config.test.yaml
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: config-volume
          configMap:
            name: gateway-api-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api-svc
  namespace: go-project-test
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: gateway-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
      name: http
