apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-api-config
  namespace: go-project-test
data:
  config.test.yaml: |
    server:
      port: 8080
    user_srv:
      host: user-srv
      port: 50051
    jwt:
      secret: ""
      cookie_domain: ".test-domain.com"
      cookie_path: "/"
      cookie_secure: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: go-project-test
  labels:
    app: gateway-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      containers:
        - name: gateway-api
          # 镜像说明：本地开发用 gateway-api:latest + imagePullPolicy: IfNotPresent
          # CI/CD 部署时 kubectl set image 会覆盖为 docker.io/username/gateway-api:vX.Y.Z
          image: gateway-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ENV
              value: "test"
            # JWT Secret 从 Secret 注入（覆盖 ConfigMap 中的空值）
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-srv-secret
                  key: jwt-secret
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs/config.test.yaml
              subPath: config.test.yaml
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: config-volume
          configMap:
            name: gateway-api-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api-svc
  namespace: go-project-test
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: gateway-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
      name: http
