# ============ user-srv 敏感配置 Secret ============
#
# 为什么敏感信息要用 Secret 而不是 ConfigMap？
# → Secret 数据在 etcd 中加密存储（若开启 encryption at rest），
#    kubectl describe 默认不显示 Secret 内容，RBAC 可单独控制 Secret 访问权限
#    而 ConfigMap 是明文存储，任何有 namespace 读权限的人都能看到密码
#
# ⚠️ 生产环境务必替换以下值！
#   生成强随机密码: openssl rand -base64 32
#   生成 JWT Secret:  openssl rand -base64 64

apiVersion: v1
kind: Secret
metadata:
  name: user-srv-secret
  namespace: go-project
type: Opaque
stringData:
  # stringData 字段可以直接写明文，K8s 会自动 base64 编码存储
  # 比 data 字段（需要手动 base64）更方便人类维护
  mysql-password: "123456"                  # TODO: 生产环境替换为强密码
  jwt-secret: "k8s-prod-secret-change-me"   # TODO: 生产环境替换为随机生成
