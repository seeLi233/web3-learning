# ============ Workflow 元信息 ============

# 为什么叫 "Docker Build & Push"？
# → 名字描述了这个 Workflow 做的事：构建 Docker 镜像 + 推送到 Registry
#    团队成员一眼就知道这个 Workflow 是管镜像的
name: Docker Build & Push

# ============ 触发器 ============

# 为什么只在打 tag 时触发，而不是每次 push 都触发？
# → 每次 push 都构建镜像太浪费（GitHub Actions 按分钟计费，免费额度 2000 分钟/月）
#    镜像构建只在"要发布一个版本"时做。Git Tag 就是版本发布的信号——打 tag = 这是一个正式版本
# 作用：只在 git tag v1.0.0 这种操作时触发构建
on:
    push:
        tags:
            - "v*"      # v 开头的所有 tag（v1.0.0, v2.3.1 等）
                        # 为什么用通配符？→ 不用每次发版改 YAML，打了 v+数字 的 tag 就自动触发

env:
    # 为什么用 env 而不是每个 Step 里写死？
    # → 一个地方改 Registry，所有 Job 同步变更
    REGISTRY: docker.io

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        # ============ Matrix 构建多个服务 ============

        # 为什么用 matrix？
        # → 项目有两个 Go 服务（gateway-api + user-srv），构建逻辑几乎一样，只是 Dockerfile 路径不同
        #    matrix 让 GitHub 并行启动两个 Runner 同时构建，构建时间 = max(单个服务) 而非 sum
        #    添加第三个服务时，只需在 matrix 列表里加一行，不用复制粘贴整个 Job
        strategy:
            matrix:
                service:
                    # 为什么用 name + dockerfile 的 map 结构？
                    # → 每个服务唯一不同的就是 Dockerfile 路径，其他（Registry、tag 规则）完全一样
                    - name: gateway-api
                      dockerfile: deploy/Dockerfile.gateway-api
                    - name: user-srv
                      dockerfile: deploy/Dockerfile.user-srv

        steps:
            # ============ Step 1: 拉代码 ============
            - uses: actions/checkout@v4

            # ============ Step 2: 登录 Docker Hub ============

            # 为什么用 docker/login-action 而不是 docker login 命令？
            # → 官方 Action 自动处理 credentials 安全存储、多 Registry 同时登录、
            #    logout 清理等细节。直接用命令需要自己管理这些
            # 作用：把 Runner 和 Docker Hub 之间的认证建立起来，之后才能 push
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}    # 为什么用 secrets？
                password: ${{ secrets.DOCKER_PASSWORD }}    # → 任何敏感信息都不能出现在 YAML 明文里
                                                            #    GitHub 会自动把 secrets 值在日志中脱敏为 ***

            # ============ Step 3: 设置 Buildx ============

            # 为什么需要 Buildx 而不是原版 docker build？
            # → Buildx 是 Docker 的增强构建引擎，支持多平台构建（arm64+amd64）、
            #    构建缓存（cache-from/cache-to）、并行构建等高级特性
            # 作用：启用 Docker BuildKit 引擎，加速镜像构建
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # ============ Step 4: 提取元数据 ============

            # 为什么需要这一步？
            # → 自动从 Git 信息生成 Docker 标签和 OCI 注解（版本号、commit SHA、构建时间等）
            #    不用自己写 shell 脚本解析 git tag
            # 作用：生成 labels（opencontainers 标准注释）和 tags（镜像版本号）
            - name: Extract metadata
              id: meta          # 给 Step 一个 ID，后续用 ${{ steps.meta.outputs.tags }} 引用
              uses: docker/metadata-action@v5
              with:
                # 为什么镜像名拼接 matrix.service.name？
                # → 每个服务有自己的镜像：docker.io/username/gateway-api 和 docker.io/username/user-srv
                #    用 matrix 变量动态拼接，两个服务自动生成各自的 tag 集合
                images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}
                # 为什么用 type=semver,pattern={{version}}？
                # → 从 git tag（如 v1.2.3）提取版本号 1.2.3，自动生成镜像 tag
                tags: |
                    type=semver,pattern={{version}}     # v1.2.3 → tag: 1.2.3
                    type=semver,pattern={{major}}       # v1.2.3 → tag: 1
                    type=semver,pattern={{major}}.{{minor}}     # v1.2.3 → tag: 1.2
                    type=raw,value=latest               # 固定打 latest tag

            # ============ Step 5: 构建并推送镜像 ============

            # 为什么用 docker/build-push-action 而不是自己写 docker build + docker push？
            # → 集成 BuildKit 缓存、多平台构建、自动处理 push 重试失败的层
            # 作用：构建 Docker 镜像 → 推送到 Registry → 一步完成
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                context: .                              # Dockerfile 的构建上下文（当前仓库根目录）
                file: ${{ matrix.service.dockerfile }}  # Dockerfile 路径（从 matrix 变量读取，两个服务各自用各自的 Dockerfile）
                push: true
                # 为什么打多个 tags？
                # → latest 给开发环境自动拉最新版本，1.2.3 给生产环境做精确回滚
                #    只打 latest 的话，出问题想回滚不知道回滚到哪个版本
                tags: ${{ steps.meta.outputs.tags }}        # 引用 Step metadata 生成的标签列表
                labels: ${{ steps.meta.outputs.labels }}    # OCI 标准标签（记录构建时间、commit SHA 等）
                # 为什么用 GitHub Actions Cache 做 Docker 缓存？
                # → type=gha 把 Docker 层缓存存在 GitHub Actions 的缓存服务中
                #    下次构建时，没变的层直接读缓存跳过，构建从 3 分钟降到 10 秒
                #    mode=max：所有中间层都缓存（不仅是最终镜像的层）
                cache-from: type=gha
                cache-to: type=gha,mode=max
