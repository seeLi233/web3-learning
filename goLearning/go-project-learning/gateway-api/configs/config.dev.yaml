server:
  port: 8080

user_srv:
  host: 127.0.0.1
  port: 50051

redis:
  host: 127.0.0.1
  port: 6380
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret: "dev-secret-key-change-in-prod"
  cookie_domain: ".localhost"   # 开发环境用 .localhost，生产改为 .yourdomain.com
  cookie_path: "/"
  cookie_secure: false          # 生产环境改为 true

github:
  client_id: "your_github_client_id"
  client_secret: "your_github_client_secret"
  redirect_uri: "http://localhost:8080/api/v1/oauth/github/callback"
