syntax = "proto3";

package user.v1;

option go_package = "./api/pb;pb";

// OAuth 服务定义
service OAuthService {
    // 1. 授权码相关
    rpc CreateAuthorizationCode(CreateCodeRequest) returns (CreateCodeResponse);
    rpc ValidateAuthorizationCode(ValidateCodeRequest) returns (ValidateCodeResponse);
    rpc DeleteAuthorizationCode(DeleteCodeRequest) returns (DeleteCodeResponse);

    // 2. Token 相关
    rpc CreateAccessToken(CreateTokenRequest) returns (CreateTokenResponse);
    rpc ValidateAccessToken(ValidateTokenRequest) returns (ValidateTokenResponse);
    rpc RefreshAccessToken(RefreshTokenRequest) returns (RefreshTokenResponse);
    rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);

    // 3. 用户信息
    rpc GetUserInfoByToken(GetUserInfoRequest) returns (GetUserInfoResponse);

    // 4. 客户端验证
    rpc ValidateClient(ValidateClientRequest) returns (ValidateClientResponse);

    // 5. GitHub 登录
    rpc GitHubLogin(GitHubLoginRequest) returns (GitHubLoginResponse);
    rpc BindGitHubAccount(BindGitHubRequest) returns (BindGitHubResponse);
}

// ========== 请求/响应消息 ==========

// 创建授权码
message CreateCodeRequest {
    string client_id = 1;
    string redirect_uri = 2;
    string scope = 3;
    uint64 user_id = 4;
}

message CreateCodeResponse {
    int32 code = 1;          // 0=成功，其他=错误码
    string msg = 2;          // 错误信息
    string authorization_code = 3;  // 授权码
}

// 验证授权码
message ValidateCodeRequest {
    string code = 1;
    string client_id = 2;
    string redirect_uri = 3;
}

message ValidateCodeResponse {
    int32 code = 1;
    string msg = 2;
    uint64 user_id = 3;
    string scope = 4;
}

// 删除授权码（一次性使用后删除）
message DeleteCodeRequest {
    string code = 1;
}

message DeleteCodeResponse {
    int32 code = 1;
    string msg = 2;
}

// 创建 Access Token
message CreateTokenRequest {
    string client_id = 1;
    uint64 user_id = 2;
    string scope = 3;
}

message CreateTokenResponse {
    int32 code = 1;
    string msg = 2;
    string access_token = 3;
    string refresh_token = 4;
    int64 expires_in = 5;
}

// 验证 Access Token
message ValidateTokenRequest {
    string access_token = 1;
}

message ValidateTokenResponse {
    int32 code = 1;
    string msg = 2;
    uint64 user_id = 3;
    string client_id = 4;
    string scope = 5;
}

// 刷新 Token
message RefreshTokenRequest {
    string refresh_token = 1;
    string client_id = 2;
}

message RefreshTokenResponse {
    int32 code = 1;
    string msg = 2;
    string access_token = 3;
    string refresh_token = 4;
    int64 expires_in = 5;
}

// 撤销 Token
message RevokeTokenRequest {
    string access_token = 1;
}

message RevokeTokenResponse {
    int32 code = 1;
    string msg = 2;
}

// 获取用户信息
message GetUserInfoRequest {
    string access_token = 1;
}

message GetUserInfoResponse {
    int32 code = 1;
    string msg = 2;
    uint64 user_id = 3;
    string username = 4;
    string phone = 5;
    string email = 6;
    string scope = 7;
}

// 验证客户端
message ValidateClientRequest {
    string client_id = 1;
    string client_secret = 2;
}

message ValidateClientResponse {
    int32 code = 1;
    string msg = 2;
    string name = 3;
    string redirect_uris = 4;
    string scope = 5;
}

// GitHub 登录
message GitHubLoginRequest {
    string github_code = 1;  // GitHub 授权码
}

message GitHubLoginResponse {
    int32 code = 1;
    string msg = 2;
    bool need_bind = 3;      // 是否需要绑定
    uint64 user_id = 4;      // 已绑定的用户 ID
    int64 github_id = 5;     // GitHub ID
    string github_username = 6;
    string github_email = 7;
    string access_token = 8; // JWT token（已绑定时返回）
}

// 绑定 GitHub 账号
message BindGitHubRequest {
    int64 github_id = 1;
    string github_username = 2;
    string github_email = 3;
    uint64 user_id = 4;      // 要绑定的用户 ID
}

message BindGitHubResponse {
    int32 code = 1;
    string msg = 2;
}