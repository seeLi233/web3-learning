syntax = "proto3";

package user.v1;

option go_package = "./api/pb;pb";

// 黑名单相关
message AddBlacklistRequest {
    string ip = 1;
    string reason = 2;
    string source = 3;      // 来源：manual/auto
    uint32 user_id = 4;     // 操作人
    int64 deadline = 5;     // 过期时间戳，0=永久
}

message RemoveBlacklistRequest {
    uint32 id = 1;
}

message ListBlacklistRequest {
    int32 page = 1;
    int32 size = 2;
}

message ListBlacklistResponse {
    int32 code = 1;
    string msg = 2;
    repeated BlacklistItem data = 3;
    int64 total = 4;
}

message BlacklistItem {
    uint32 id = 1;
    string ip = 2;
    string reason = 3;
    string source = 4;
    uint32 user_id = 5;
    bool status = 6;
    int64 deadline = 7;
    string created_at = 8;
}

// 风控配置相关
message ListRiskConfigRequest {
    // 空
}

message ListRiskConfigResponse {
    int32 code = 1;
    string msg = 2;
    repeated RiskConfigItem data = 3;
}

message RiskConfigItem {
    uint32 id = 1;
    string rule_key = 2;
    string rule_value = 3;
    string description = 4;
    bool status = 5;
}

message UpdateRiskConfigRequest {
    uint32 id = 1;
    string rule_value = 2;
    bool status = 3;
}

// 通用响应
message RiskResponse {
    int32 code = 1;
    string msg = 2;
}

message RefreshRiskConfigRequest {
    // 空
}

// 风控服务
service RiskService {
    // 黑名单管理
    rpc AddBlacklist(AddBlacklistRequest) returns (RiskResponse);
    rpc RemoveBlacklist(RemoveBlacklistRequest) returns (RiskResponse);
    rpc ListBlacklist(ListBlacklistRequest) returns (ListBlacklistResponse);

    // 风控配置管理
    rpc ListRiskConfig(ListRiskConfigRequest) returns (ListRiskConfigResponse);
    rpc UpdateRiskConfig(UpdateRiskConfigRequest) returns (RiskResponse);

    // 热更新
    rpc RefreshRiskConfig(RefreshRiskConfigRequest) returns (RiskResponse);
}